<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Chat - Phoenix Grove</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<style>
:root {
  --bg: #0f0f0f;
  --sidebar: #171717;
  --surface: #1e1e1e;
  --border: #333;
  --text: #f0f0f0;
  --text-secondary: #b0b0b0;
  --user-bg: #2d2d2d;
  --accent: #10a37f;
  --accent-hover: #0d8c6d;
  --input-bg: #252525;
  --danger: #ff6b6b;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  overflow: hidden;
  display: flex;
}
.sidebar {
  width: 260px;
  background: var(--sidebar);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  padding: 12px;
}
.sidebar-header { margin-bottom: 12px; }
.new-chat-btn {
  background: var(--surface);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 14px;
  cursor: pointer;
  font-size: 14px;
  width: 100%;
}
.new-chat-btn:hover { background: #2a2a2a; }
.chat-list { flex: 1; overflow-y: auto; }
.chat-item {
  padding: 10px 12px;
  border-radius: 8px;
  cursor: pointer;
  margin-bottom: 4px;
  font-size: 14px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  color: var(--text-secondary);
}
.chat-item:hover, .chat-item.active { background: var(--surface); color: var(--text); }
.chat-item .delete-btn {
  background: none;
  border: none;
  color: #888;
  cursor: pointer;
  font-size: 16px;
  padding: 0 4px;
}
.chat-item .delete-btn:hover { color: var(--danger); }
.main { flex: 1; display: flex; flex-direction: column; height: 100vh; }
.header {
  height: 56px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px;
}
.model-select {
  background: var(--surface);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 6px 12px;
  font-size: 14px;
}
.messages { flex: 1; overflow-y: auto; padding: 20px 0; }
.message {
  max-width: 800px;
  margin: 0 auto 20px;
  padding: 0 20px;
  display: flex;
  gap: 16px;
}
.message.user { flex-direction: row-reverse; }
.avatar {
  width: 32px; height: 32px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-weight: bold; font-size: 13px; flex-shrink: 0;
}
.user .avatar { background: #10a37f; }
.assistant .avatar { background: #5436da; }
.content { flex: 1; line-height: 1.6; font-size: 15px; }
.user .content {
  background: var(--user-bg);
  padding: 12px 16px;
  border-radius: 18px;
  max-width: 80%;
}
.assistant .content { padding: 4px 0; }
.content pre { background: #1a1a1a; padding: 12px; border-radius: 8px; overflow-x: auto; margin: 8px 0; }
.content code { font-family: "SF Mono", Monaco, Consolas, monospace; font-size: 13px; }
.input-area {
  padding: 16px 20px 24px;
  background: var(--bg);
  border-top: 1px solid var(--border);
}
.input-container {
  max-width: 800px;
  margin: 0 auto;
  position: relative;
  background: var(--input-bg);
  border: 1px solid #444;
  border-radius: 12px;
  padding: 8px;
}
.input-container:focus-within { border-color: #666; }
textarea {
  width: 100%;
  background: transparent;
  border: none;
  padding: 10px 50px 10px 12px;
  color: var(--text);
  font-size: 15px;
  resize: none;
  min-height: 48px;
  max-height: 200px;
  outline: none;
  font-family: inherit;
}
.send-btn, .upload-btn {
  position: absolute;
  bottom: 10px;
  background: var(--accent);
  color: white;
  border: none;
  width: 36px; height: 36px;
  border-radius: 8px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px;
}
.send-btn { right: 10px; }
.send-btn:hover { background: var(--accent-hover); }
.send-btn:disabled { background: #555; cursor: not-allowed; }
.upload-btn {
  right: 54px;
  background: #333;
  font-size: 16px;
}
.upload-btn:hover { background: #444; }
.file-preview {
  font-size: 12px;
  color: #aaa;
  padding: 4px 12px;
  display: none;
}
.empty-state {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  height: 100%; color: var(--text-secondary); text-align: center; padding: 40px;
}
.empty-state h1 { font-size: 28px; margin-bottom: 12px; color: var(--text); font-weight: 500; }
@media (max-width: 768px) { .sidebar { display: none; } .message { padding: 0 12px; } }
</style>
</head>
<body>
<div class="sidebar">
  <div class="sidebar-header">
    <button class="new-chat-btn" onclick="newChat()">+ Cuộc trò chuyện mới</button>
  </div>
  <div class="chat-list" id="chatList"></div>
</div>
<div class="main">
  <div class="header">
    <select class="model-select" id="modelSelect">
      <option value="deepseek-v4.1-flash-1017">DeepSeek V4.1 Flash (Nhanh)</option>
      <option value="glm-5.3-flash">GLM 5.3 Flash</option>
      <option value="mimo-v2.6-flash">MiMo V2.6 Flash (hỗ trợ ảnh)</option>
      <option value="glm-5.2">GLM 5.2</option>
      <option value="deepseek-v4-pro">DeepSeek V4 Pro</option>
      <option value="mimo-v2.6-pro">MiMo V2.6 Pro (hỗ trợ ảnh)</option>
      <option value="glm-5.3">GLM 5.3</option>
    </select>
    <div style="font-size:13px;color:#888;">Phoenix Grove API</div>
  </div>
  <div class="messages" id="messages">
    <div class="empty-state" id="emptyState">
      <h1>Xin chào! Tôi có thể giúp gì cho bạn?</h1>
      <p>Bắt đầu cuộc trò chuyện. Hỗ trợ ảnh (với model có vision) và file văn bản.</p>
    </div>
  </div>
  <div class="input-area">
    <div class="input-container">
      <div class="file-preview" id="filePreview"></div>
      <textarea id="userInput" placeholder="Nhập tin nhắn của bạn... (Shift+Enter xuống dòng)" rows="1"></textarea>
      <input type="file" id="fileInput" accept="image/*,.txt,.md,.pdf,.docx" style="display:none" multiple>
      <button class="upload-btn" onclick="document.getElementById('fileInput').click()" title="Tải ảnh hoặc file">📎</button>
      <button class="send-btn" id="sendBtn" onclick="sendMessage()">➤</button>
    </div>
  </div>
</div>

<script>
const API_KEY = "pgsk_plan_ea9aa2e775845d7a1c99f84615f8a7762acbb3ddf86af3af64ed3ec00e93227e";
const BASE_URL = "https://api.pgsgrove.com/v1/chat/completions";

let chats = JSON.parse(localStorage.getItem("chats") || "[]");
let currentChatId = null;
let isGenerating = false;
let pendingFiles = [];

marked.setOptions({
  highlight: function(code, lang) {
    if (lang && hljs.getLanguage(lang)) {
      return hljs.highlight(code, { language: lang }).value;
    }
    return hljs.highlightAuto(code).value;
  },
  breaks: true
});

function saveChats() {
  localStorage.setItem("chats", JSON.stringify(chats));
  renderChatList();
}

function renderChatList() {
  const list = document.getElementById("chatList");
  list.innerHTML = "";
  chats.slice().reverse().forEach(chat => {
    const div = document.createElement("div");
    div.className = "chat-item" + (chat.id === currentChatId ? " active" : "");
    div.innerHTML = `<span>${chat.title || "Cuộc trò chuyện mới"}</span><button class="delete-btn" onclick="event.stopPropagation(); deleteChat('${chat.id}')">✕</button>`;
    div.onclick = () => loadChat(chat.id);
    list.appendChild(div);
  });
}

function newChat() {
  const id = Date.now().toString();
  const chat = { id, title: "Cuộc trò chuyện mới", messages: [], model: document.getElementById("modelSelect").value };
  chats.push(chat);
  currentChatId = id;
  saveChats();
  renderMessages();
}

function deleteChat(id) {
  if (!confirm("Xóa cuộc trò chuyện này?")) return;
  chats = chats.filter(c => c.id !== id);
  if (currentChatId === id) {
    currentChatId = chats.length ? chats[chats.length - 1].id : null;
    if (!currentChatId) newChat();
  }
  saveChats();
  renderMessages();
}

function loadChat(id) {
  currentChatId = id;
  const chat = chats.find(c => c.id === id);
  if (chat) document.getElementById("modelSelect").value = chat.model || "deepseek-v4.1-flash-1017";
  renderChatList();
  renderMessages();
}

function renderMessages() {
  const container = document.getElementById("messages");
  const empty = document.getElementById("emptyState");
  const chat = chats.find(c => c.id === currentChatId);
  
  if (!chat || chat.messages.length === 0) {
    container.innerHTML = "";
    container.appendChild(empty);
    empty.style.display = "flex";
    return;
  }
  
  empty.style.display = "none";
  container.innerHTML = "";
  
  chat.messages.forEach(msg => {
    const div = document.createElement("div");
    div.className = `message ${msg.role}`;
    const avatar = document.createElement("div");
    avatar.className = "avatar";
    avatar.textContent = msg.role === "user" ? "Bạn" : "AI";
    const content = document.createElement("div");
    content.className = "content";
    if (msg.role === "assistant") {
      content.innerHTML = DOMPurify.sanitize(marked.parse(msg.content || ""));
    } else {
      content.textContent = msg.content;
    }
    div.appendChild(avatar);
    div.appendChild(content);
    container.appendChild(div);
  });
  container.scrollTop = container.scrollHeight;
}

document.getElementById("fileInput").addEventListener("change", async (e) => {
  pendingFiles = [];
  const preview = document.getElementById("filePreview");
  preview.innerHTML = "";
  preview.style.display = "none";
  for (const file of e.target.files) {
    if (file.type.startsWith("image/")) {
      const base64 = await fileToBase64(file);
      pendingFiles.push({ type: "image", data: base64, name: file.name });
      preview.innerHTML += `📷 ${file.name}<br>`;
    } else if (file.type.startsWith("text/") || file.name.endsWith(".md") || file.name.endsWith(".txt")) {
      const text = await file.text();
      pendingFiles.push({ type: "text", data: text, name: file.name });
      preview.innerHTML += `📄 ${file.name} (${text.length} ký tự)<br>`;
    } else {
      preview.innerHTML += `⚠️ ${file.name} (chỉ hỗ trợ ảnh và file văn bản)<br>`;
    }
  }
  if (preview.innerHTML) preview.style.display = "block";
  e.target.value = "";
});

function fileToBase64(file) {
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.readAsDataURL(file);
  });
}

async function sendMessage() {
  if (isGenerating) return;
  const input = document.getElementById("userInput");
  let text = input.value.trim();
  if (!text && pendingFiles.length === 0) return;
  
  if (!currentChatId) newChat();
  const chat = chats.find(c => c.id === currentChatId);
  if (!chat) return;
  
  let userContent = text;
  let apiMessages = [];
  
  const visionModels = ["mimo-v2.6-flash", "mimo-v2.6-pro", "deepseek-v4.1-flash-1017"];
  const isVision = visionModels.includes(chat.model);
  
  if (pendingFiles.length) {
    const images = pendingFiles.filter(f => f.type === "image");
    const texts = pendingFiles.filter(f => f.type === "text");
    if (texts.length) userContent += "\n\n" + texts.map(f => `[File: ${f.name}]\n${f.data}`).join("\n\n");
    if (images.length && isVision) {
      const contentParts = [{ type: "text", text: userContent || "Phân tích ảnh này" }];
      images.forEach(img => contentParts.push({ type: "image_url", image_url: { url: img.data } }));
      apiMessages = [{ role: "user", content: contentParts }];
      userContent = (userContent || "[Đã gửi ảnh]") + " " + images.map(i => `📷${i.name}`).join(" ");
    } else if (images.length && !isVision) {
      userContent += "\n\n(Đã đính kèm ảnh nhưng model hiện tại không hỗ trợ vision. Hãy chọn MiMo hoặc DeepSeek Flash.)";
    }
  }
  
  if (!apiMessages.length) {
    apiMessages = chat.messages.map(m => ({ role: m.role, content: m.content })).concat([{ role: "user", content: userContent }]);
  } else {
    apiMessages = chat.messages.map(m => ({ role: m.role, content: m.content })).concat(apiMessages);
  }
  
  chat.messages.push({ role: "user", content: userContent });
  if (chat.messages.filter(m => m.role === "user").length === 1) {
    chat.title = (text || "Ảnh/File").slice(0, 40);
  }
  chat.model = document.getElementById("modelSelect").value;
  saveChats();
  renderMessages();
  
  input.value = "";
  input.style.height = "auto";
  pendingFiles = [];
  document.getElementById("filePreview").style.display = "none";
  isGenerating = true;
  document.getElementById("sendBtn").disabled = true;
  
  chat.messages.push({ role: "assistant", content: "Đang suy nghĩ..." });
  renderMessages();
  
  try {
    const response = await fetch(BASE_URL, {
      method: "POST",
      headers: {
        "Authorization": `Bearer ${API_KEY}`,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        model: chat.model,
        messages: apiMessages,
        temperature: 0.7
      })
    });
    
    if (!response.ok) {
      const err = await response.json().catch(() => ({}));
      throw new Error(err.error?.message || `Lỗi HTTP ${response.status}`);
    }
    
    const data = await response.json();
    const full = data.choices?.[0]?.message?.content || "(Không có phản hồi từ AI)";
    
    chat.messages[chat.messages.length - 1].content = full;
    saveChats();
    renderMessages();
  } catch (err) {
    console.error(err);
    chat.messages[chat.messages.length - 1].content = `**Lỗi:** ${err.message}\n\nHãy thử lại hoặc kiểm tra kết nối / số dư.`;
    saveChats();
    renderMessages();
  } finally {
    isGenerating = false;
    document.getElementById("sendBtn").disabled = false;
    document.getElementById("userInput").focus();
  }
}

document.getElementById("userInput").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

document.getElementById("userInput").addEventListener("input", function() {
  this.style.height = "auto";
  this.style.height = Math.min(this.scrollHeight, 200) + "px";
});

document.getElementById("modelSelect").addEventListener("change", () => {
  if (currentChatId) {
    const chat = chats.find(c => c.id === currentChatId);
    if (chat) chat.model = this.value;
    saveChats();
  }
});

if (chats.length === 0) newChat();
else {
  currentChatId = chats[chats.length - 1].id;
  renderChatList();
  renderMessages();
}
</script>
</body>
</html>
