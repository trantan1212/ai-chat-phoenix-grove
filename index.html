<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Chat - Phoenix Grove</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<style>
:root {
  --bg: #0f0f0f;
  --sidebar: #171717;
  --surface: #1e1e1e;
  --border: #2a2a2a;
  --text: #ececec;
  --text-secondary: #a0a0a0;
  --user-bg: #2a2a2a;
  --assistant-bg: transparent;
  --accent: #10a37f;
  --accent-hover: #0d8c6d;
  --input-bg: #2a2a2a;
  --danger: #ef4444;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  overflow: hidden;
  display: flex;
}
.sidebar {
  width: 260px;
  background: var(--sidebar);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  padding: 12px;
}
.sidebar-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
}
.new-chat-btn {
  background: var(--surface);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 14px;
  cursor: pointer;
  font-size: 14px;
  width: 100%;
  transition: background 0.2s;
}
.new-chat-btn:hover { background: #2a2a2a; }
.chat-list {
  flex: 1;
  overflow-y: auto;
  margin-top: 8px;
}
.chat-item {
  padding: 10px 12px;
  border-radius: 8px;
  cursor: pointer;
  margin-bottom: 4px;
  font-size: 14px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  color: var(--text-secondary);
}
.chat-item:hover, .chat-item.active {
  background: var(--surface);
  color: var(--text);
}
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  height: 100vh;
}
.header {
  height: 56px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px;
  background: var(--bg);
}
.model-select {
  background: var(--surface);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 6px 12px;
  font-size: 14px;
}
.messages {
  flex: 1;
  overflow-y: auto;
  padding: 20px 0;
}
.message {
  max-width: 800px;
  margin: 0 auto 20px;
  padding: 0 20px;
  display: flex;
  gap: 16px;
}
.message.user { flex-direction: row-reverse; }
.avatar {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
  font-size: 14px;
  flex-shrink: 0;
}
.user .avatar { background: #10a37f; }
.assistant .avatar { background: #5436da; }
.content {
  flex: 1;
  line-height: 1.6;
  font-size: 15px;
}
.user .content {
  background: var(--user-bg);
  padding: 12px 16px;
  border-radius: 18px;
  max-width: 80%;
}
.assistant .content {
  padding: 4px 0;
}
.content pre {
  background: #1a1a1a;
  padding: 12px;
  border-radius: 8px;
  overflow-x: auto;
  margin: 8px 0;
}
.content code {
  font-family: "SF Mono", Monaco, Consolas, monospace;
  font-size: 13px;
}
.input-area {
  padding: 16px 20px 24px;
  background: var(--bg);
  border-top: 1px solid var(--border);
}
.input-container {
  max-width: 800px;
  margin: 0 auto;
  position: relative;
}
textarea {
  width: 100%;
  background: var(--input-bg);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 14px 50px 14px 16px;
  color: var(--text);
  font-size: 15px;
  resize: none;
  min-height: 52px;
  max-height: 200px;
  outline: none;
  font-family: inherit;
}
textarea:focus { border-color: #444; }
.send-btn {
  position: absolute;
  right: 8px;
  bottom: 8px;
  background: var(--accent);
  color: white;
  border: none;
  width: 36px;
  height: 36px;
  border-radius: 8px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
}
.send-btn:hover { background: var(--accent-hover); }
.send-btn:disabled { background: #444; cursor: not-allowed; }
.typing {
  color: var(--text-secondary);
  font-style: italic;
  padding: 8px 0;
}
.error {
  color: var(--danger);
  background: #2a1515;
  padding: 12px;
  border-radius: 8px;
  margin: 10px auto;
  max-width: 800px;
}
.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100%;
  color: var(--text-secondary);
  text-align: center;
  padding: 40px;
}
.empty-state h1 { font-size: 28px; margin-bottom: 12px; color: var(--text); font-weight: 500; }
.empty-state p { font-size: 16px; max-width: 500px; }
@media (max-width: 768px) {
  .sidebar { display: none; }
  .message { padding: 0 12px; }
}
</style>
</head>
<body>
<div class="sidebar">
  <div class="sidebar-header">
    <button class="new-chat-btn" onclick="newChat()">+ Cuộc trò chuyện mới</button>
  </div>
  <div class="chat-list" id="chatList"></div>
</div>
<div class="main">
  <div class="header">
    <select class="model-select" id="modelSelect">
      <option value="deepseek-v4.1-flash-1017">DeepSeek V4.1 Flash (Nhanh)</option>
      <option value="glm-5.3-flash">GLM 5.3 Flash</option>
      <option value="mimo-v2.6-flash">MiMo V2.6 Flash</option>
      <option value="glm-5.2">GLM 5.2</option>
      <option value="deepseek-v4-pro">DeepSeek V4 Pro</option>
      <option value="mimo-v2.6-pro">MiMo V2.6 Pro</option>
      <option value="glm-5.3">GLM 5.3</option>
    </select>
    <div style="font-size:13px;color:#888;">Phoenix Grove API</div>
  </div>
  <div class="messages" id="messages">
    <div class="empty-state" id="emptyState">
      <h1>Xin chào! Tôi có thể giúp gì cho bạn?</h1>
      <p>Hãy bắt đầu cuộc trò chuyện. Giao diện giống ChatGPT & Grok, sử dụng các model open-source mạnh mẽ.</p>
    </div>
  </div>
  <div class="input-area">
    <div class="input-container">
      <textarea id="userInput" placeholder="Nhập tin nhắn của bạn..." rows="1"></textarea>
      <button class="send-btn" id="sendBtn" onclick="sendMessage()">➤</button>
    </div>
  </div>
</div>

<script>
const API_KEY = "pgsk_plan_ea9aa2e775845d7a1c99f84615f8a7762acbb3ddf86af3af64ed3ec00e93227e";
const BASE_URL = "https://api.pgsgrove.com/v1/chat/completions";

let chats = JSON.parse(localStorage.getItem("chats") || "[]");
let currentChatId = null;
let isStreaming = false;

marked.setOptions({
  highlight: function(code, lang) {
    if (lang && hljs.getLanguage(lang)) {
      return hljs.highlight(code, { language: lang }).value;
    }
    return hljs.highlightAuto(code).value;
  },
  breaks: true
});

function saveChats() {
  localStorage.setItem("chats", JSON.stringify(chats));
  renderChatList();
}

function renderChatList() {
  const list = document.getElementById("chatList");
  list.innerHTML = "";
  chats.slice().reverse().forEach(chat => {
    const div = document.createElement("div");
    div.className = "chat-item" + (chat.id === currentChatId ? " active" : "");
    div.textContent = chat.title || "Cuộc trò chuyện mới";
    div.onclick = () => loadChat(chat.id);
    list.appendChild(div);
  });
}

function newChat() {
  const id = Date.now().toString();
  const chat = { id, title: "Cuộc trò chuyện mới", messages: [], model: document.getElementById("modelSelect").value };
  chats.push(chat);
  currentChatId = id;
  saveChats();
  renderMessages();
}

function loadChat(id) {
  currentChatId = id;
  const chat = chats.find(c => c.id === id);
  if (chat) {
    document.getElementById("modelSelect").value = chat.model || "deepseek-v4.1-flash-1017";
  }
  renderChatList();
  renderMessages();
}

function renderMessages() {
  const container = document.getElementById("messages");
  const empty = document.getElementById("emptyState");
  const chat = chats.find(c => c.id === currentChatId);
  
  if (!chat || chat.messages.length === 0) {
    container.innerHTML = "";
    container.appendChild(empty);
    empty.style.display = "flex";
    return;
  }
  
  empty.style.display = "none";
  container.innerHTML = "";
  
  chat.messages.forEach(msg => {
    const div = document.createElement("div");
    div.className = `message ${msg.role}`;
    const avatar = document.createElement("div");
    avatar.className = "avatar";
    avatar.textContent = msg.role === "user" ? "Bạn" : "AI";
    const content = document.createElement("div");
    content.className = "content";
    if (msg.role === "assistant") {
      content.innerHTML = DOMPurify.sanitize(marked.parse(msg.content || ""));
    } else {
      content.textContent = msg.content;
    }
    div.appendChild(avatar);
    div.appendChild(content);
    container.appendChild(div);
  });
  container.scrollTop = container.scrollHeight;
}

async function sendMessage() {
  if (isStreaming) return;
  const input = document.getElementById("userInput");
  const text = input.value.trim();
  if (!text) return;
  
  if (!currentChatId) newChat();
  const chat = chats.find(c => c.id === currentChatId);
  if (!chat) return;
  
  chat.messages.push({ role: "user", content: text });
  if (chat.messages.length === 1) {
    chat.title = text.slice(0, 40) + (text.length > 40 ? "..." : "");
  }
  chat.model = document.getElementById("modelSelect").value;
  saveChats();
  renderMessages();
  
  input.value = "";
  input.style.height = "auto";
  isStreaming = true;
  document.getElementById("sendBtn").disabled = true;
  
  // Add assistant message placeholder
  chat.messages.push({ role: "assistant", content: "" });
  renderMessages();
  const assistantDiv = document.querySelector(".message.assistant:last-child .content");
  
  try {
    const response = await fetch(BASE_URL, {
      method: "POST",
      headers: {
        "Authorization": `Bearer ${API_KEY}`,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        model: chat.model,
        messages: chat.messages.slice(0, -1).map(m => ({ role: m.role, content: m.content })),
        stream: true,
        temperature: 0.7
      })
    });
    
    if (!response.ok) {
      const err = await response.json().catch(() => ({}));
      throw new Error(err.error?.message || `Lỗi ${response.status}`);
    }
    
    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let full = "";
    
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      const chunk = decoder.decode(value);
      const lines = chunk.split("\n");
      for (const line of lines) {
        if (line.startsWith("data: ")) {
          const data = line.slice(6);
          if (data === "[DONE]") continue;
          try {
            const json = JSON.parse(data);
            const delta = json.choices?.[0]?.delta?.content || "";
            if (delta) {
              full += delta;
              assistantDiv.innerHTML = DOMPurify.sanitize(marked.parse(full));
              document.getElementById("messages").scrollTop = document.getElementById("messages").scrollHeight;
            }
          } catch (e) {}
        }
      }
    }
    
    chat.messages[chat.messages.length - 1].content = full;
    saveChats();
  } catch (err) {
    console.error(err);
    const last = chat.messages[chat.messages.length - 1];
    last.content = `**Lỗi:** ${err.message}\n\nVui lòng kiểm tra API key, số dư tài khoản hoặc thử lại.`;
    saveChats();
    renderMessages();
  } finally {
    isStreaming = false;
    document.getElementById("sendBtn").disabled = false;
    document.getElementById("userInput").focus();
  }
}

document.getElementById("userInput").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

document.getElementById("userInput").addEventListener("input", function() {
  this.style.height = "auto";
  this.style.height = Math.min(this.scrollHeight, 200) + "px";
});

document.getElementById("modelSelect").addEventListener("change", () => {
  if (currentChatId) {
    const chat = chats.find(c => c.id === currentChatId);
    if (chat) chat.model = document.getElementById("modelSelect").value;
    saveChats();
  }
});

// Init
if (chats.length === 0) {
  newChat();
} else {
  currentChatId = chats[chats.length - 1].id;
  renderChatList();
  renderMessages();
}
</script>
</body>
</html>
